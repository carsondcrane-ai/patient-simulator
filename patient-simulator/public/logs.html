<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Simulator — Instructor Logs</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <span class="brand">🏥 Patient Simulator</span>
    <div class="nav-links">
      <a href="/chat.html">Chat</a>
      <a href="/logs.html">Logs</a>
      <a href="#" id="logout-link">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h1 style="margin-bottom:1.5rem">Student Interaction Logs</h1>

    <div id="index-section" class="hidden" style="margin-bottom:2rem">
      <div class="auth-card" style="max-width:600px;margin:0 0 1rem 0">
        <h2 style="font-size:1.1rem;margin-bottom:0.5rem">Index Reference Material</h2>
        <p class="text-dim" style="font-size:0.85rem;margin-bottom:1rem">
          Add text to the Vectorize knowledge base for RAG context during patient chats.
        </p>
        <div id="index-alert"></div>
        <form id="index-form">
          <div class="form-group">
            <label for="index-text">Reference Text</label>
            <textarea id="index-text" placeholder="Paste medical reference material, guidelines, etc."></textarea>
          </div>
          <div class="form-group">
            <label for="index-tag">Tag (optional)</label>
            <input type="text" id="index-tag" placeholder="e.g. cardiology-guidelines" />
          </div>
          <button type="submit" class="btn">Index Material</button>
        </form>
      </div>
    </div>

    <div class="table-wrap">
      <table id="logs-table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Scenario</th>
            <th>Messages</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="logs-body">
          <tr><td colspan="4" class="text-dim text-center">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Session detail modal -->
  <div class="modal-overlay hidden" id="detail-modal">
    <div class="modal">
      <button class="modal-close" id="detail-close">&times;</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/js/logs.js"></script>
</body>
</html>
