<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Simulator — Login</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <span class="brand">🏥 Patient Simulator</span>
  </nav>

  <div class="container">
    <div class="auth-card">
      <!-- Login form -->
      <div id="login-view">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to continue your patient interactions.</p>
        <div id="login-alert"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required />
          </div>
          <button type="submit" class="btn" style="width:100%">Log In</button>
        </form>
        <p class="text-dim text-center mt-2" style="font-size:0.85rem">
          Don't have an account?
          <a href="#" id="show-register">Register</a>
        </p>
      </div>

      <!-- Register form -->
      <div id="register-view" class="hidden">
        <h1>Create account</h1>
        <p class="subtitle">Register as a student or instructor.</p>
        <div id="register-alert"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" id="reg-name" required />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required />
          </div>
          <div class="form-group">
            <label for="reg-password">Password (min 6 chars)</label>
            <input type="password" id="reg-password" minlength="6" required />
          </div>
          <div class="form-group">
            <label for="reg-role">Role</label>
            <select id="reg-role">
              <option value="student">Student</option>
              <option value="instructor">Instructor</option>
            </select>
          </div>
          <button type="submit" class="btn" style="width:100%">Register</button>
        </form>
        <p class="text-dim text-center mt-2" style="font-size:0.85rem">
          Already have an account?
          <a href="#" id="show-login">Log In</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
